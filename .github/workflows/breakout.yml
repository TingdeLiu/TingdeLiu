name: Contribution Breakout

on:
  schedule:
    - cron: "0 0 * * *"        # daily, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/breakout.py
      - .github/workflows/breakout.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate breakout-dark.svg and breakout-light.svg
        run: python3 scripts/breakout.py --user "${{ github.repository_owner }}" --out dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
